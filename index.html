<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Generator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="card">
      <h1>Password Generator</h1>

      <div class="section">
        <p class="section-title">Password Strength</p>
        <div class="radio-group">
          <label><input type="radio" id="weak" name="strength" /> Weak</label>
          <label
            ><input type="radio" id="medium" name="strength" /> Medium</label
          >
          <label
            ><input type="radio" id="strong" name="strength" /> Strong</label
          >
        </div>
      </div>

      <div class="section">
        <p class="section-title">Password Length</p>
        <input
          type="number"
          min="1"
          max="50"
          id="length"
          placeholder="Enter length"
        />
      </div>

      <button class="generate-btn" onclick="copy()">Generate</button>

      <div class="output" id="result">
        <input type="text" id="password" />
        <button id="copyBtn">Copy</button>
      </div>
    </div>

    <script src="main.js"></script>
  </body>
</html>
